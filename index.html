<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeMind — AI Coding Agent</title>
  <meta name="description" content="Local AI coding agent powered by Ollama. Code editor on left, AI chat on right." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ══════════════════════ TOP BAR ══════════════════════ -->
<header class="topbar">
  <div class="topbar-brand">
    <div class="brand-icon">⬡</div>
    <span class="brand-name">CodeMind</span>
    <span class="brand-sub">AI Coding Agent</span>
  </div>

  <div class="topbar-file">
    <button class="topbar-btn" onclick="newFile()" title="New File (Ctrl+N)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
      New
    </button>
    <button class="topbar-btn" onclick="openFilePicker()" title="Open File (Ctrl+O)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      Open
    </button>
    <button class="topbar-btn" onclick="saveFile()" title="Save (Ctrl+S)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      Save
    </button>
    <div class="filename-pill" id="filename-pill">untitled.py</div>
  </div>

  <div class="topbar-model">
    <div class="model-status" id="model-status">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-label">Not connected</span>
    </div>
    <select class="model-dropdown" id="model-select" onchange="onModelChange()">
      <option value="">— Pick a model —</option>
    </select>
    <button class="topbar-btn accent" onclick="refreshModels()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      Connect
    </button>
  </div>
</header>

<!-- ══════════════════════ MAIN SPLIT ══════════════════════ -->
<main class="workspace">

  <!-- ─── LEFT: CODE EDITOR ─── -->
  <section class="editor-side" id="editor-side">
    <div class="pane-label">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
      CODE EDITOR
      <span class="pane-lang" id="pane-lang">Python</span>
      <div style="flex:1"></div>
      <button class="pane-action-btn" onclick="formatCode()" title="Format">⌥⇧F Format</button>
      <button class="pane-action-btn" onclick="clearEditor()" title="Clear">Clear</button>
    </div>

    <!-- Tab row -->
    <div class="tab-row" id="tab-row"></div>

    <!-- Editor with line numbers -->
    <div class="editor-wrap">
      <div class="gutter" id="gutter">1</div>
      <textarea
        id="main-editor"
        class="main-editor"
        spellcheck="false"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        placeholder="// Write your code here, or ask the AI on the right →"
        oninput="onEditorChange()"
        onscroll="syncGutter()"
        onkeydown="editorKeydown(event)"
        onclick="updateCursor()"
        onkeyup="updateCursor()"
      ></textarea>
    </div>

    <div class="editor-footer">
      <span id="cursor-pos">Ln 1, Col 1</span>
      <span id="lang-badge">Python</span>
      <span id="enc-badge">UTF-8</span>
      <span id="modified-badge" style="display:none;color:var(--yellow)">● Unsaved</span>
    </div>
  </section>

  <!-- Drag divider -->
  <div class="divider" id="divider"></div>

  <!-- ─── RIGHT: AI CHAT ─── -->
  <section class="chat-side" id="chat-side">
    <div class="pane-label">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      AI CHAT
      <span class="pane-lang" id="chat-model-label">No model selected</span>
      <div style="flex:1"></div>
      <button class="pane-action-btn" onclick="clearChat()">Clear</button>
      <button class="pane-action-btn" onclick="exportChat()">Export</button>
    </div>

    <!-- Messages -->
    <div class="messages" id="messages">
      <div class="welcome-card">
        <div class="welcome-emoji">🤖</div>
        <h2>CodeMind AI</h2>
        <p>Powered by your local Ollama model.<br>Write code on the left, chat with AI here.</p>

        <div class="quick-grid">
          <button class="quick-chip" onclick="setPrompt('Write a Python REST API with FastAPI and CRUD operations')">🚀 REST API</button>
          <button class="quick-chip" onclick="sendEditorCode()">📋 Explain my code</button>
          <button class="quick-chip" onclick="setPrompt('Debug and fix errors in my code:\n\n' + getEditorCode())">🐛 Debug code</button>
          <button class="quick-chip" onclick="setPrompt('Refactor my code for best practices:\n\n' + getEditorCode())">✨ Refactor</button>
          <button class="quick-chip" onclick="setPrompt('Write unit tests for:\n\n' + getEditorCode())">🧪 Write tests</button>
          <button class="quick-chip" onclick="setPrompt('Add docstrings and comments to:\n\n' + getEditorCode())">📝 Document</button>
        </div>

        <div class="connect-hint" id="connect-hint">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          Click <strong>Connect</strong> in the top bar to load your Ollama models
        </div>
      </div>
    </div>

    <!-- Input area -->
    <div class="chat-input-box">
      <div class="input-actions">
        <button class="chip-btn" onclick="sendEditorCode()" title="Send all editor code to AI">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          Send code
        </button>
        <button class="chip-btn" onclick="sendSelection()" title="Send selected text">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          Selection
        </button>
        <span class="token-hint" id="token-hint">0 chars</span>
      </div>
      <div class="textarea-row">
        <textarea
          id="chat-input"
          class="chat-textarea"
          placeholder="Ask me to write, debug, explain or refactor code… (Ctrl+Enter to send)"
          rows="3"
          onkeydown="chatKeydown(event)"
          oninput="updateCharCount()"
        ></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  </section>
</main>

<!-- ══════════════════════ HIDDEN INPUTS ══════════════════════ -->
<input type="file" id="file-picker" style="display:none"
  accept=".py,.js,.ts,.jsx,.tsx,.html,.css,.json,.md,.txt,.java,.cpp,.c,.rs,.go,.rb,.php,.sh,.yaml,.yml,.sql"
  onchange="loadFile(event)" />

<!-- ══════════════════════ TOAST ══════════════════════ -->
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
